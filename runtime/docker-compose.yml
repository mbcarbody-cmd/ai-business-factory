services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revenue}
      POSTGRES_USER: ${POSTGRES_USER:-revenue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenue} -d ${POSTGRES_DB:-revenue}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  runtime:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-revenue}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-revenue}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [backend, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RUNTIME_DOMAIN: ${RUNTIME_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [runtime]
    security_opt:
      - no-new-privileges:true
    networks: [edge]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
