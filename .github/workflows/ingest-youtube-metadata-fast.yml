name: Ingest YouTube Metadata Fast

on:
  pull_request:
    paths:
      - "OPS/knowledge_ingestion/requests/*.json"
      - ".github/workflows/ingest-youtube-metadata-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Extract metadata, RSS description, and chapters
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import quote

          headers = {'User-Agent': 'Mozilla/5.0'}

          def fetch(url, timeout=45):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.read()

          for request_path in sorted(Path('OPS/knowledge_ingestion/requests').glob('*.json')):
              request = json.loads(request_path.read_text(encoding='utf-8'))
              video_id = request['video_id']
              video_url = request.get('url') or f'https://www.youtube.com/watch?v={video_id}'
              root = Path('OPS/knowledge_ingestion/youtube') / video_id
              root.mkdir(parents=True, exist_ok=True)
              logs = []
              title = channel = channel_url = channel_id = published = description = ''

              try:
                  url = f'https://www.youtube.com/oembed?url={quote(video_url, safe="")}&format=json'
                  status, body = fetch(url)
                  obj = json.loads(body.decode('utf-8', errors='replace'))
                  title = obj.get('title', '')
                  channel = obj.get('author_name', '')
                  channel_url = obj.get('author_url', '')
                  logs.append(f'oembed status={status} title={bool(title)}')
              except Exception as exc:
                  logs.append(f'oembed {type(exc).__name__}: {exc}')

              if channel_url:
                  try:
                      status, body = fetch(channel_url)
                      page = body.decode('utf-8', errors='replace')
                      for pattern in [
                          r'"channelId":"(UC[0-9A-Za-z_-]{20,})"',
                          r'"browseId":"(UC[0-9A-Za-z_-]{20,})"',
                          r'youtube\.com/channel/(UC[0-9A-Za-z_-]{20,})',
                          r'feeds/videos\.xml\?channel_id=(UC[0-9A-Za-z_-]{20,})',
                      ]:
                          match = re.search(pattern, page)
                          if match:
                              channel_id = match.group(1)
                              break
                      logs.append(f'channel status={status} id={channel_id}')
                  except Exception as exc:
                      logs.append(f'channel {type(exc).__name__}: {exc}')

              if channel_id:
                  try:
                      status, body = fetch(f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}')
                      ns = {
                          'atom': 'http://www.w3.org/2005/Atom',
                          'yt': 'http://www.youtube.com/xml/schemas/2015',
                          'media': 'http://search.yahoo.com/mrss/',
                      }
                      tree = ET.fromstring(body)
                      for entry in tree.findall('atom:entry', ns):
                          if entry.findtext('yt:videoId', default='', namespaces=ns) != video_id:
                              continue
                          title = entry.findtext('atom:title', default=title, namespaces=ns)
                          published = entry.findtext('atom:published', default='', namespaces=ns)
                          group = entry.find('media:group', ns)
                          if group is not None:
                              description = group.findtext('media:description', default='', namespaces=ns)
                          break
                      logs.append(f'feed status={status} matched={bool(description or published)}')
                  except Exception as exc:
                      logs.append(f'feed {type(exc).__name__}: {exc}')

              chapters = []
              for line in description.splitlines():
                  value = line.strip()
                  if re.match(r'^(?:\d{1,2}:)?\d{1,2}:\d{2}\s+', value):
                      chapters.append(value)

              lines = [
                  '# Fast YouTube Knowledge Source', '',
                  f'- Video ID: `{video_id}`',
                  f'- Title: {title}',
                  f'- Channel: {channel}',
                  f'- Channel ID: {channel_id}',
                  f'- Published: {published}',
                  f'- Source URL: {video_url}', '',
                  '## Description', '', description or '_Description unavailable._', '',
                  '## Chapters', '',
              ]
              lines.extend(chapters or ['_No chapters found._'])
              lines.extend(['', '## Diagnostics', '', '```text', '\n'.join(logs), '```', ''])
              (root / 'source-fast.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Persist fast source
        run: |
          set -e
          branch="${{ github.head_ref || github.ref_name }}"
          git config user.name "ai-business-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add OPS/knowledge_ingestion/youtube/*/source-fast.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Capture fast YouTube knowledge metadata"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch" || true
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
