name: Revenue regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qpv-revenue-regression:
    name: QPV revenue and buyer-path regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run QPV static regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_daily_agent_improvement_engine.py
          python3 scripts/check_daily_learning_operator_queue.py
          python3 scripts/check_daily_operator_action_opened_ledger.py
          python3 scripts/check_daily_learning_admin_router.py
          python3 scripts/check_daily_learning_promotion_receipt_ledger.py
          python3 scripts/check_qpv_source_kpi_admin.py
          python3 scripts/check_qpv_root_offer_cta.py
          python3 scripts/check_qpv_offer_checkout_handoff.py
          python3 scripts/check_qpv_offer_checkout_attribution.py
          python3 scripts/check_qpv_payment_ledger_source_attribution.py
          python3 scripts/check_qpv_checkout_flow.py
          python3 scripts/check_qpv_order_status_flow.py
          python3 scripts/check_qpv_completed_order_status.py
          python3 scripts/check_qpv_fulfilled_order_status.py
          python3 scripts/check_qpv_revenue_command_center.py
          python3 scripts/check_qpv_recovery_revenue_reconciliation.py
          python3 scripts/check_qpv_recovery_revenue_command_launchpad.py
          python3 scripts/check_qpv_paid_fulfillment.py
          python3 scripts/check_qpv_paid_fulfillment_router.py
          python3 scripts/check_qpv_order_admin_revenue_nav.py
          python3 scripts/check_qpv_outreach_lead_pipeline.py
          python3 scripts/check_auto_parts_price_finder_product.py
          python3 scripts/check_auto_parts_bank_transfer_order.py
          python3 scripts/check_auto_parts_payment_destination_setup.py
          python3 scripts/check_auto_parts_buyer_outreach.py
          python3 scripts/check_auto_parts_first_buyer_outreach_launchpad.py
          python3 scripts/check_auto_parts_outreach_send_queue.py
          python3 scripts/check_auto_parts_buyer_reply_triage.py
          python3 scripts/check_auto_parts_real_buyer_importer.py
          python3 scripts/check_auto_parts_paid_confirmation.py
          python3 scripts/check_auto_parts_paid_receipt.py
          python3 scripts/check_auto_parts_paid_fulfillment.py
          python3 scripts/check_auto_parts_instant_payment_link_checkout.py
          python3 scripts/check_auto_parts_buyer_close_room.py
          python3 scripts/check_auto_parts_payment_proof_handoff.py
          python3 scripts/check_auto_parts_bank_statement_import.py
          python3 scripts/check_auto_parts_proof_statement_match.py
          python3 scripts/check_auto_parts_buyer_lead_capture.py
          python3 scripts/check_auto_parts_payment_launch_url_builder.py
          python3 scripts/check_auto_parts_root_checkout_launcher.py
          python3 scripts/check_auto_parts_bank_transfer_payment_request.py
          python3 scripts/check_auto_parts_verified_paid_router.py
          python3 scripts/check_auto_parts_quote_to_payment_close_room.py
          python3 scripts/check_auto_parts_first_paid_order_cockpit.py
          python3 scripts/check_auto_parts_paid_order_link_generator.py
          python3 scripts/check_auto_parts_unpaid_order_recovery_sequencer.py
          python3 scripts/check_auto_parts_buyer_batch_payment_runner.py
          python3 scripts/check_auto_parts_statement_paid_event_matcher.py
          python3 scripts/check_auto_parts_first_paid_kpi_capture.py
          python3 scripts/check_revenue_regression_ci.py
