name: Revenue regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qpv-revenue-regression:
    name: QPV revenue and buyer-path regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run QPV static regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_daily_agent_improvement_engine.py
          python3 scripts/check_daily_learning_operator_queue.py
          python3 scripts/check_qpv_source_kpi_admin.py
          python3 scripts/check_qpv_root_offer_cta.py
          python3 scripts/check_qpv_offer_checkout_handoff.py
          python3 scripts/check_qpv_offer_checkout_attribution.py
          python3 scripts/check_qpv_payment_ledger_source_attribution.py
          python3 scripts/check_qpv_checkout_flow.py
          python3 scripts/check_qpv_order_status_flow.py
          python3 scripts/check_qpv_revenue_command_center.py
          python3 scripts/check_qpv_recovery_revenue_reconciliation.py
          python3 scripts/check_qpv_recovery_revenue_command_launchpad.py
          python3 scripts/check_qpv_order_admin_revenue_nav.py
          python3 scripts/check_qpv_outreach_lead_pipeline.py
          python3 scripts/check_revenue_regression_ci.py