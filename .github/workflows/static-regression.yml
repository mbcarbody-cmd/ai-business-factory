name: static-regression

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  revenue-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Quick Product Video paid order gate regression
        run: node scripts/regression-quick-video-paid-order.js
