name: APF statement paid event matcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apf-statement-paid-event-matcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run APF statement paid event matcher regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_auto_parts_statement_paid_event_matcher.py
