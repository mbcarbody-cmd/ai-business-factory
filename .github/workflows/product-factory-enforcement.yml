name: Product Factory Enforcement

on:
  push:
  pull_request:

jobs:
  verify-product-factory-outputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current lightweight P0 app outputs
        run: |
          set -e
          required_files=(
            "README.md"
            "index.html"
            "website/index.html"
            "products/content-hook-factory/README.md"
            "OPS/task_board_current_p0.json"
            "OPS/product_gates/content_hook_factory_gate_2026_06_15.md"
            "OPS/qa/CONTENT_HOOK_FACTORY_QA_VERDICT_2026_06_15.md"
            "OPS/deploy_loop/CONTENT_HOOK_FACTORY_RELEASE_CHECK_2026_06_15.md"
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty required output: $file"; exit 1; }
          done
          echo "Current Content Hook Factory output files are present."

      - name: Verify app contains core workflow markers
        run: |
          set -e
          grep -q "Content Hook Factory" website/index.html
          grep -q "hook" website/index.html
          grep -q "post" website/index.html
          grep -q "video" website/index.html
          grep -q "landing" website/index.html
          grep -q "Markdown" website/index.html
          grep -q "localStorage" website/index.html
          grep -q "Content Hook Factory" README.md
          grep -q "current_p0_product" OPS/task_board_current_p0.json
          echo "Content Hook Factory workflow markers are present."

      - name: Validate JSON outputs
        run: |
          python3 -m json.tool OPS/task_board_current_p0.json >/dev/null
          echo "JSON outputs are valid."
