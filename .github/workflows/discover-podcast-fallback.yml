name: Discover Podcast Fallback

on:
  pull_request:
    paths:
      - "OPS/knowledge_ingestion/requests/*.json"
      - ".github/workflows/discover-podcast-fallback.yml"
  workflow_dispatch:

concurrency:
  group: podcast-fallback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Rank podcast shows and episodes
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import quote

          headers = {'User-Agent': 'Mozilla/5.0'}

          def fetch(url, timeout=25):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.read()

          def tokens(value):
              return {w for w in re.findall(r'[A-Za-zÀ-ž0-9]+', (value or '').lower()) if len(w) >= 4}

          def clean(value):
              value = html.unescape(re.sub(r'<[^>]+>', ' ', value or ''))
              return re.sub(r'\s+', ' ', value).strip()

          for request_path in sorted(Path('OPS/knowledge_ingestion/requests').glob('*.json')):
              request = json.loads(request_path.read_text(encoding='utf-8'))
              video_id = request['video_id']
              root = Path('OPS/knowledge_ingestion/youtube') / video_id
              fast_path = root / 'source-fast.md'
              source = fast_path.read_text(encoding='utf-8') if fast_path.exists() else ''
              title_match = re.search(r'^- Title:\s*(.*)$', source, re.M)
              channel_match = re.search(r'^- Channel:\s*(.*)$', source, re.M)
              title = title_match.group(1).strip() if title_match else ''
              channel = channel_match.group(1).strip() if channel_match else ''
              title_tokens = tokens(title)
              channel_tokens = tokens(channel)
              logs = []

              search_terms = [channel, title]
              if title_tokens:
                  search_terms.append(' '.join(list(title_tokens)[:6]))
              results = []
              for term in list(dict.fromkeys(x for x in search_terms if x)):
                  try:
                      url = f'https://itunes.apple.com/search?term={quote(term)}&media=podcast&entity=podcast&limit=40'
                      status, body = fetch(url)
                      data = json.loads(body.decode('utf-8', errors='replace'))
                      results.extend(data.get('results', []))
                      logs.append(f'itunes term={term[:50]} status={status} results={data.get("resultCount", 0)}')
                  except Exception as exc:
                      logs.append(f'itunes term={term[:50]} {type(exc).__name__}: {exc}')

              show_candidates = {}
              for row in results:
                  feed = row.get('feedUrl')
                  if not feed:
                      continue
                  show_name = row.get('collectionName') or row.get('trackName') or ''
                  artist = row.get('artistName', '')
                  hay_tokens = tokens(f'{show_name} {artist}')
                  score = 4 * len(channel_tokens & hay_tokens) + len(title_tokens & hay_tokens)
                  key = feed
                  if key not in show_candidates or score > show_candidates[key]['score']:
                      show_candidates[key] = {
                          'feed_url': feed,
                          'show_name': show_name,
                          'artist': artist,
                          'score': score,
                      }

              ranked_shows = sorted(show_candidates.values(), key=lambda row: row['score'], reverse=True)[:12]
              logs.append(f'ranked shows={len(ranked_shows)}')
              best = {}
              best_score = -1

              normalized_title = re.sub(r'\W+', ' ', title.lower()).strip()
              for show in ranked_shows:
                  try:
                      status, body = fetch(show['feed_url'], 30)
                      tree = ET.fromstring(body)
                      logs.append(f'feed show={show["show_name"][:40]} score={show["score"]} status={status} bytes={len(body)}')
                      for item in tree.findall('.//item'):
                          episode_title = item.findtext('title', default='')
                          description = item.findtext('description', default='')
                          content = item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded', default='')
                          hay = f'{episode_title} {description} {content}'
                          episode_tokens = tokens(hay)
                          score = show['score'] + 3 * len(title_tokens & episode_tokens)
                          normalized_episode = re.sub(r'\W+', ' ', episode_title.lower()).strip()
                          if normalized_title and normalized_title == normalized_episode:
                              score += 100
                          elif normalized_title and normalized_title in re.sub(r'\W+', ' ', hay.lower()):
                              score += 50
                          if score <= best_score:
                              continue
                          enclosure = item.find('enclosure')
                          audio_url = enclosure.get('url', '') if enclosure is not None else ''
                          transcript_urls = []
                          for child in list(item):
                              if child.tag.lower().endswith('transcript'):
                                  value = child.attrib.get('url') or (child.text or '').strip()
                                  if value:
                                      transcript_urls.append(value)
                          best_score = score
                          best = {
                              'match_score': score,
                              'feed_url': show['feed_url'],
                              'show_name': show['show_name'],
                              'artist': show['artist'],
                              'episode_title': episode_title,
                              'description': clean(description or content),
                              'audio_url': audio_url,
                              'duration': item.findtext('{http://www.itunes.com/dtds/podcast-1.0.dtd}duration', default=''),
                              'published': item.findtext('pubDate', default=''),
                              'guid': item.findtext('guid', default=''),
                              'transcript_urls': transcript_urls,
                          }
                  except Exception as exc:
                      logs.append(f'feed show={show["show_name"][:40]} {type(exc).__name__}: {exc}')

              # Require meaningful title overlap to avoid downloading the wrong episode.
              accepted = bool(best and best_score >= 12)
              if not accepted:
                  logs.append(f'best score rejected={best_score}')
                  best = {}

              lines = [
                  '# Podcast Fallback Discovery', '',
                  f'- Video ID: `{video_id}`',
                  f'- YouTube title: {title}',
                  f'- YouTube channel: {channel}',
                  f'- Match accepted: {accepted}',
                  f'- Match score: {best.get("match_score", "")}',
                  f'- Show: {best.get("show_name", "")}',
                  f'- Episode: {best.get("episode_title", "")}',
                  f'- Published: {best.get("published", "")}',
                  f'- Duration: {best.get("duration", "")}',
                  f'- Feed URL: {best.get("feed_url", "")}',
                  f'- Audio URL: {best.get("audio_url", "")}',
                  f'- Transcript URLs: {json.dumps(best.get("transcript_urls", []), ensure_ascii=False)}', '',
                  '## Description', '', best.get('description', '') or '_No matching podcast episode found._', '',
                  '## Diagnostics', '', '```text', '\n'.join(logs), '```',
              ]
              (root / 'podcast-fallback.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Persist podcast fallback
        run: |
          set -e
          branch="${{ github.head_ref || github.ref_name }}"
          git config user.name "ai-business-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add OPS/knowledge_ingestion/youtube/*/podcast-fallback.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Discover ranked podcast fallbacks"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch" || true
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
