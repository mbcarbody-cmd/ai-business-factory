name: Discover Podcast Feed for Tadas Burgaila

on:
  pull_request:
    paths:
      - "OPS/knowledge_ingestion/youtube/arQTi6UPGY0/trigger.md"
      - ".github/workflows/analyze-podcast-feed-tadas-burgaila.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Find podcast feed and episode
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import quote
          import urllib.request

          root = Path('OPS/knowledge_ingestion/youtube/arQTi6UPGY0')
          raw = root / 'podcast-feed'
          raw.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent':'Mozilla/5.0'}
          logs = []

          def fetch(url, timeout=30):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.read()

          results = []
          for term in ['Tapk Geresniu', 'Artur Lebedenko', 'Tadas Burgaila']:
              url = f'https://itunes.apple.com/search?term={quote(term)}&media=podcast&entity=podcast&limit=25'
              try:
                  status, body = fetch(url)
                  data = json.loads(body.decode('utf-8', errors='replace'))
                  logs.append(f'itunes {term} status={status} results={data.get("resultCount", 0)}')
                  results.extend(data.get('results', []))
              except Exception as exc:
                  logs.append(f'itunes {term} {type(exc).__name__}: {exc}')

          feeds = []
          for row in results:
              feed = row.get('feedUrl')
              name = row.get('collectionName') or row.get('trackName') or ''
              artist = row.get('artistName', '')
              if feed and ('geresn' in name.lower() or 'lebedenko' in artist.lower() or 'geresn' in artist.lower()):
                  feeds.append((feed, name, artist))
          feeds = list(dict.fromkeys(feeds))
          logs.append(f'candidate feeds={len(feeds)}')

          found = {}
          for feed_url, show_name, artist in feeds:
              try:
                  status, body = fetch(feed_url, 45)
                  text = body.decode('utf-8', errors='replace')
                  logs.append(f'feed {feed_url} status={status} bytes={len(body)}')
                  (raw / 'feed.xml').write_text(text, encoding='utf-8')
                  tree = ET.fromstring(body)
                  for item in tree.findall('.//item'):
                      title = item.findtext('title', default='')
                      desc = item.findtext('description', default='')
                      content = item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded', default='')
                      hay = f'{title} {desc} {content}'.lower()
                      if 'tadas burgaila' not in hay and 'burgaila' not in hay:
                          continue
                      enclosure = item.find('enclosure')
                      audio_url = enclosure.get('url', '') if enclosure is not None else ''
                      duration = item.findtext('{http://www.itunes.com/dtds/podcast-1.0.dtd}duration', default='')
                      pub_date = item.findtext('pubDate', default='')
                      guid = item.findtext('guid', default='')
                      transcript_urls = []
                      for child in list(item):
                          if child.tag.lower().endswith('transcript'):
                              url = child.attrib.get('url') or (child.text or '').strip()
                              if url:
                                  transcript_urls.append(url)
                      found = {
                          'feed_url': feed_url,
                          'show_name': show_name,
                          'artist': artist,
                          'title': title,
                          'description': desc or content,
                          'audio_url': audio_url,
                          'duration': duration,
                          'pub_date': pub_date,
                          'guid': guid,
                          'transcript_urls': transcript_urls,
                      }
                      break
                  if found:
                      break
              except Exception as exc:
                  logs.append(f'feed {feed_url} {type(exc).__name__}: {exc}')

          transcript_text = ''
          for url in found.get('transcript_urls', []):
              try:
                  status, body = fetch(url, 45)
                  transcript_text = body.decode('utf-8', errors='replace')
                  logs.append(f'transcript {url} status={status} bytes={len(body)}')
                  (raw / 'provided-transcript.txt').write_text(transcript_text, encoding='utf-8')
                  break
              except Exception as exc:
                  logs.append(f'transcript {url} {type(exc).__name__}: {exc}')

          description = html.unescape(re.sub(r'<[^>]+>', ' ', found.get('description', '')))
          description = re.sub(r'\s+', ' ', description).strip()
          lines = [
              '# Podcast Feed Discovery', '',
              f'- Show: {found.get("show_name", "")}',
              f'- Episode: {found.get("title", "")}',
              f'- Feed URL: {found.get("feed_url", "")}',
              f'- Published: {found.get("pub_date", "")}',
              f'- Duration: {found.get("duration", "")}',
              f'- Audio URL: {found.get("audio_url", "")}',
              f'- GUID: {found.get("guid", "")}',
              f'- Transcript URLs: {json.dumps(found.get("transcript_urls", []), ensure_ascii=False)}', '',
              '## Description', '', description or '_Description unavailable._', '',
              '## Provided transcript', '', transcript_text or '_No feed transcript was provided._', '',
              '## Diagnostics', '', '```text', '\n'.join(logs), '```',
          ]
          (root / 'podcast-feed-source.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Persist podcast discovery
        run: |
          set -e
          branch="${{ github.head_ref || github.ref_name }}"
          git config user.name "ai-business-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add OPS/knowledge_ingestion/youtube/arQTi6UPGY0/podcast-feed-source.md
          if git diff --cached --quiet; then
            echo "No podcast discovery changes to commit"
            exit 0
          fi
          git commit -m "Discover podcast feed for Tadas Burgaila episode"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch" || true
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to persist podcast discovery after retries"
          exit 1
