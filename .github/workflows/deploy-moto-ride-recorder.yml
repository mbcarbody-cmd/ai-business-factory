name: Deploy Moto Ride Recorder PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'products/moto-ride-recorder-pwa/**'
      - '.github/workflows/deploy-moto-ride-recorder.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: moto-ride-recorder-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: products/moto-ride-recorder-pwa
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
