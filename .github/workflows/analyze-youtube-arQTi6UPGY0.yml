name: Analyze YouTube conversation arQTi6UPGY0

on:
  pull_request:
    paths:
      - "OPS/knowledge_ingestion/youtube/arQTi6UPGY0/**"
      - ".github/workflows/analyze-youtube-arQTi6UPGY0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install transcript tools
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir yt-dlp youtube-transcript-api requests

      - name: Fetch metadata and available subtitles
        env:
          VIDEO_ID: arQTi6UPGY0
          VIDEO_URL: https://www.youtube.com/watch?v=arQTi6UPGY0
        run: |
          set +e
          mkdir -p OPS/knowledge_ingestion/youtube/arQTi6UPGY0/raw
          cd OPS/knowledge_ingestion/youtube/arQTi6UPGY0/raw

          yt-dlp --no-playlist --skip-download --dump-single-json "$VIDEO_URL" > metadata.json 2> yt-dlp-metadata.log
          yt-dlp --no-playlist --skip-download --write-subs --write-auto-subs --sub-langs "all,-live_chat" --sub-format "vtt" -o "transcript.%(language)s.%(ext)s" "$VIDEO_URL" > yt-dlp-subs.log 2>&1

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('metadata.json')
          try:
              valid = bool(json.loads(p.read_text(encoding='utf-8')))
          except Exception:
              valid = False
          Path('metadata-valid.txt').write_text('yes' if valid else 'no', encoding='utf-8')
          PY

          if [ "$(cat metadata-valid.txt)" != "yes" ]; then
            for base in https://inv.nadeko.net https://invidious.nerdvpn.de https://inv.thepixora.com https://yt.chocolatemoo53.com; do
              echo "Trying $base" >> fallback.log
              curl -L --connect-timeout 10 --max-time 30 -fsS "$base/api/v1/videos/$VIDEO_ID" -o candidate.json 2>> fallback.log
              python - <<'PY'
          import json
          from pathlib import Path
          p = Path('candidate.json')
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              ok = isinstance(data, dict) and bool(data.get('title'))
          except Exception:
              ok = False
          Path('candidate-valid.txt').write_text('yes' if ok else 'no', encoding='utf-8')
          PY
              if [ "$(cat candidate-valid.txt)" = "yes" ]; then
                mv candidate.json metadata.json
                echo "$base" > invidious-base.txt
                break
              fi
            done
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          video_id = 'arQTi6UPGY0'
          out = Path('transcript.youtube-api.json')
          errors = []
          try:
              from youtube_transcript_api import YouTubeTranscriptApi
              try:
                  api = YouTubeTranscriptApi()
                  listing = api.list(video_id)
              except Exception:
                  listing = YouTubeTranscriptApi.list_transcripts(video_id)
              chosen = None
              for item in listing:
                  if chosen is None or getattr(item, 'is_generated', False):
                      chosen = item
              if chosen is not None:
                  fetched = chosen.fetch()
                  rows = []
                  for row in fetched:
                      if hasattr(row, 'text'):
                          rows.append({'text': row.text, 'start': row.start, 'duration': row.duration})
                      else:
                          rows.append(dict(row))
                  out.write_text(json.dumps(rows, ensure_ascii=False), encoding='utf-8')
          except Exception as exc:
              errors.append(repr(exc))
          Path('youtube-transcript-api.log').write_text('\n'.join(errors), encoding='utf-8')
          PY

          if [ -f invidious-base.txt ]; then
            BASE="$(cat invidious-base.txt)"
            curl -L --connect-timeout 10 --max-time 30 -fsS "$BASE/api/v1/captions/$VIDEO_ID" -o captions.json 2>> fallback.log
            python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          base_path = Path('invidious-base.txt')
          captions_path = Path('captions.json')
          if base_path.exists() and captions_path.exists():
              base = base_path.read_text(encoding='utf-8').strip()
              try:
                  data = json.loads(captions_path.read_text(encoding='utf-8'))
              except Exception:
                  data = {}
              tracks = data.get('captions', data if isinstance(data, list) else [])
              for i, track in enumerate(tracks[:8]):
                  url = track.get('url') or track.get('baseUrl')
                  if not url:
                      continue
                  url = urljoin(base, url)
                  try:
                      r = requests.get(url, timeout=30)
                      r.raise_for_status()
                      lang = track.get('languageCode') or track.get('label') or str(i)
                      Path(f'transcript.invidious.{lang}.vtt').write_text(r.text, encoding='utf-8')
                  except Exception:
                      pass
          PY
          fi

          exit 0

      - name: Normalize transcript
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('OPS/knowledge_ingestion/youtube/arQTi6UPGY0')
          raw = root / 'raw'
          root.mkdir(parents=True, exist_ok=True)

          meta = {}
          try:
              meta = json.loads((raw / 'metadata.json').read_text(encoding='utf-8'))
          except Exception:
              pass

          title = meta.get('title', '')
          channel = meta.get('channel') or meta.get('uploader') or meta.get('author', '')
          duration = meta.get('duration') or meta.get('lengthSeconds', '')
          upload_date = meta.get('upload_date') or meta.get('publishedText') or meta.get('published', '')
          description = meta.get('description') or meta.get('descriptionHtml', '') or ''

          lines = [
              '# YouTube Knowledge Source', '',
              '- Video ID: `arQTi6UPGY0`',
              f'- Title: {title}',
              f'- Channel: {channel}',
              f'- Duration seconds: {duration}',
              f'- Upload date: {upload_date}',
              '- Source URL: https://www.youtube.com/watch?v=arQTi6UPGY0', '',
              '## Description', '', re.sub(r'<[^>]+>', ' ', str(description)), '',
              '## Transcript', ''
          ]

          transcript = []
          seen = set()
          for path in sorted(raw.glob('transcript.*.vtt')):
              for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  s = line.strip()
                  if not s or s.startswith(('WEBVTT', 'Kind:', 'Language:', 'NOTE')) or '-->' in s or re.fullmatch(r'\d+', s):
                      continue
                  s = re.sub(r'<[^>]+>', '', s)
                  s = s.replace('&amp;', '&').replace('&#39;', "'").replace('&quot;', '"')
                  s = re.sub(r'\s+', ' ', s).strip()
                  if s and s not in seen:
                      seen.add(s)
                      transcript.append(s)

          api_json = raw / 'transcript.youtube-api.json'
          if api_json.exists():
              try:
                  for row in json.loads(api_json.read_text(encoding='utf-8')):
                      s = re.sub(r'\s+', ' ', str(row.get('text', ''))).strip()
                      if s and s not in seen:
                          seen.add(s)
                          transcript.append(s)
              except Exception:
                  pass

          if transcript:
              lines.extend(transcript)
          else:
              lines.append('_No transcript was returned._')

          lines += ['', '## Diagnostics', '']
          for log_name in ['yt-dlp-metadata.log', 'yt-dlp-subs.log', 'fallback.log', 'youtube-transcript-api.log']:
              p = raw / log_name
              if p.exists() and p.stat().st_size:
                  lines += [f'### {log_name}', '', '```text', p.read_text(encoding='utf-8', errors='replace')[-5000:], '```', '']

          (root / 'source.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Print normalized source for analysis
        run: |
          echo "===== BEGIN NORMALIZED SOURCE ====="
          cat OPS/knowledge_ingestion/youtube/arQTi6UPGY0/source.md
          echo "===== END NORMALIZED SOURCE ====="
