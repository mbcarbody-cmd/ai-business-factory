name: Revenue Agent Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: read

concurrency:
  group: revenue-agent-pilot
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create bounded revenue report
        run: python3 scripts/revenue_agent_pilot.py
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-agent-report-${{ github.run_number }}
          path: runtime/revenue_agent_pilot/report.md
          if-no-files-found: warn
          retention-days: 14
