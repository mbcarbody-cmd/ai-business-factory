name: Assistant Architect QA
on:
  push:
    paths:
      - 'website/ai-assistant-architect.html'
      - 'tests/test_ai_assistant_architect.py'
      - '.github/workflows/assistant-architect-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run executable product tests
        run: python3 tests/test_ai_assistant_architect.py
