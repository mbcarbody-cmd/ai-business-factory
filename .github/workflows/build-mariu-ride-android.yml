name: Build Mariu Ride Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mariu-ride-acceleration-mvp
    paths:
      - "products/moto-sup-native-android/**"
      - ".github/workflows/build-mariu-ride-android.yml"
  pull_request:
    paths:
      - "products/moto-sup-native-android/**"
      - ".github/workflows/build-mariu-ride-android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/moto-sup-native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mariu-ride-lab-debug-apk
          path: products/moto-sup-native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
