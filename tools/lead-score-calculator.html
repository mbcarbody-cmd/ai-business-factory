<!doctype html>
<html lang="lt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Score Calculator</title><style>body{font-family:Arial,system-ui;background:#06111f;color:#eaf2ff;margin:0;padding:24px}.box{max-width:820px;margin:auto;background:#0f1b2d;border:1px solid #263b59;border-radius:18px;padding:22px}label{display:block;margin-top:14px}select,input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #33506e;background:#07111f;color:#fff;margin-top:6px}button{margin-top:18px;padding:14px 18px;border:0;border-radius:12px;background:#2ee66b;font-weight:800}.score{font-size:42px;font-weight:900;color:#70ff9b}</style></head><body><div class="box"><h1>AI Pilot Lead Score</h1><p>Greitai nusprendžia, ar verta rašyti verslui dėl AI Agent Setup piloto.</p><label>Segmentas<select id="segment"><option value="25">Auto dalys / e-commerce</option><option value="20">Servisas / detailing</option><option value="18">Agentūra</option><option value="10">Kita</option></select></label><label>Ar turi daug pasikartojančių užklausų?<select id="repeat"><option value="25">Taip</option><option value="10">Kartais</option><option value="0">Neaišku</option></select></label><label>Ar matosi aktyvus verslas online?<select id="active"><option value="20">Taip</option><option value="8">Silpnai</option><option value="0">Ne</option></select></label><label>Ar yra aiškus kontaktas?<select id="contact"><option value="15">El. paštas / forma</option><option value="10">Facebook / telefonas</option><option value="0">Sunku rasti</option></select></label><label>Ar galima pasiūlyti greitą naudą?<select id="pain"><option value="15">Taip, leadai / tekstai / CRM</option><option value="8">Galbūt</option><option value="0">Neaišku</option></select></label><button onclick="calc()">Skaičiuoti</button><p class="score" id="score">0</p><p id="advice"></p></div><script>function calc(){let s=['segment','repeat','active','contact','pain'].reduce((a,id)=>a+Number(document.getElementById(id).value),0);score.textContent=s+'/100';advice.textContent=s>=70?'Karštas leadas: siųsti outreach šiandien.':s>=45?'Vidutinis: siųsti trumpą test žinutę.':'Žemas: nedeginti laiko, ieškoti geresnio.'}</script></body></html>
