<!doctype html>
<html lang="lt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outreach Generator</title><style>body{font-family:Arial,system-ui;background:#06111f;color:#eaf2ff;margin:0;padding:24px}.box{max-width:880px;margin:auto;background:#0f1b2d;border:1px solid #263b59;border-radius:18px;padding:22px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #33506e;background:#07111f;color:#fff;margin:6px 0 12px}button{padding:13px 18px;border:0;border-radius:12px;background:#2ee66b;font-weight:800}textarea.out{height:260px}</style></head><body><div class="box"><h1>AI Agent Setup Outreach Generator</h1><p>Generuoja pardavimo žinutę 299 € pilotui pagal segmentą.</p><input id="biz" placeholder="Verslo pavadinimas"><select id="seg"><option>auto dalių pardavėjams</option><option>servisams</option><option>detailing / plovykloms</option><option>e-commerce parduotuvėms</option><option>agentūroms</option></select><input id="pain" placeholder="Galimas skausmas, pvz. daug užklausų, nėra CRM, silpni aprašymai"><button onclick="gen()">Generuoti</button><textarea id="out" class="out"></textarea></div><script>function gen(){let b=biz.value||'Jūsų verslui';let s=seg.value;let p=pain.value||'daug rankinio darbo su užklausomis ir tekstais';out.value=`Sveiki, ${b},\n\nDirbame su praktišku AI darbuotojo setupu ${s}. Idėja paprasta: per 72 val. pastatome mini sistemą, kuri padeda tvarkyti leadus, ruošti pardavimo / reklamos tekstus ir turėti aiškų pipeline vienoje vietoje.\n\nPagal tai, ką matau, pas jus gali būti aktualu: ${p}.\n\nDabar ieškome kelių paid pilot klientų. Kaina: 299 €. Ne teorinė konsultacija, o konkretus veikiantis setupas.\n\nAr būtų įdomu trumpai pasižiūrėti demo principą?\n`;}</script></body></html>
