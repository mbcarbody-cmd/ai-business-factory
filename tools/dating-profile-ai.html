<!doctype html>
<html lang="lt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dating Profile AI</title><style>body{font-family:Arial,system-ui;background:#130716;color:#fff;margin:0;padding:20px}.wrap{max-width:1050px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#211024;border:1px solid #5b2b62;border-radius:18px;padding:16px;margin:12px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:12px;border:1px solid #7c3f84;background:#120716;color:#fff;margin:6px 0 10px}button{background:#ff4fd8;color:#180014;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.score{font-size:38px;font-weight:900;color:#7dff9b}pre{white-space:pre-wrap;background:#120716;border:1px solid #5b2b62;border-radius:14px;padding:14px}</style></head><body><div class="wrap"><h1>Dating Profile AI</h1><p>Saugus profilės gerinimo įrankis: bio, foto checklist, pirmos žinutės, date idėjos. Be botų, spam'o ar taisyklių laužymo.</p><div class="grid"><div class="card"><h2>Profilio duomenys</h2><input id="age" placeholder="Amžius"><input id="city" placeholder="Miestas"><select id="goal"><option>Rimtesnės pažintys</option><option>Lengvas bendravimas</option><option>Nauji žmonės</option></select><textarea id="interests" placeholder="Pomėgiai, charakteris, ką mėgsti" rows="4"></textarea><textarea id="oldbio" placeholder="Senas bio, jei turi" rows="3"></textarea><button onclick="generate()">Generuoti paketą</button></div><div class="card"><h2>Photo checklist</h2><label><input type="checkbox" id="p1"> Aiški veido foto</label><br><label><input type="checkbox" id="p2"> Visa figūra</label><br><label><input type="checkbox" id="p3"> Veikla / hobis</label><br><label><input type="checkbox" id="p4"> Socialinė, bet ne chaosas</label><br><label><input type="checkbox" id="p5"> Be akinių visose foto</label><br><label><input type="checkbox" id="p6"> Be senų / neryškių foto</label><p class="score" id="score">0/100</p><button onclick="scorePhotos()">Įvertinti foto</button></div></div><div class="card"><h2>Rezultatas</h2><pre id="out">Čia atsiras profilis, openeriai ir planas.</pre></div></div><script>
function val(id){return document.getElementById(id).value.trim()}
function scorePhotos(){let n=[p1,p2,p3,p4,p5,p6].filter(x=>x.checked).length;score.textContent=Math.round(n/6*100)+'/100'}
function generate(){let a=val('age')||'30+';let c=val('city')||'mieste';let g=val('goal');let i=val('interests')||'kelionės, humoras, aktyvus laisvalaikis';let bio1=`${a}, ${c}. Patinka ${i}. Ieškau žmogaus, su kuriuo lengva kalbėtis ir norisi susitikti gyvai, ne tik susirašinėti.`;let bio2=`Jei tavo idealus vakaras yra geras pokalbis, skanus maistas ir truputis spontaniškumo — jau turim nuo ko pradėti. ${i}. Tikslas: ${g.toLowerCase()}.`;let openers=[`Labas. Iš tavo profilio atrodo, kad su tavim nebūtų nuobodu. Kas šią savaitę buvo geriausias momentas?`,`Turiu greitą klausimą: spontaniškas pasivaikščiojimas ar suplanuota vakarienė?`,`Tavo profilis turi gerą vibe. Ką dažniausiai renkiesi savaitgaliui — ramiau ar veiksmas?`,`Jei reikėtų išsirinkti vieną vietą mieste geram pokalbiui, kur vestum?`];out.textContent=`BIO variantas 1:\n${bio1}\n\nBIO variantas 2:\n${bio2}\n\nPirmos žinutės:\n- ${openers.join('\n- ')}\n\n7 dienų planas:\n1. Atrink 6 foto pagal checklist.\n2. Įkelk aiškią pirmą foto.\n3. Naudok vieną bio variantą 3 dienas.\n4. Rašyk tik individualias žinutes, ne copy-paste visiems.\n5. Po 10 pokalbių pasižymėk, kas veikia.\n6. Atnaujink bio pagal atsakymus.\n7. Susitikimą siūlyk paprastai: kava / pasivaikščiojimas / trumpa vakarienė.`}
</script></body></html>
