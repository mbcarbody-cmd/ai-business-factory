openapi: 3.1.0
info:
  title: Parts Business OS Core API
  version: 1.0.0
  description: Multi-tenant API for seller inventory, warehouse, orders, billing and audit.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    PartInput:
      type: object
      required: [internal_code, title, category, quantity]
      properties:
        internal_code: { type: string, minLength: 1 }
        oem_code: { type: [string, 'null'] }
        title: { type: string, minLength: 3 }
        category: { type: string }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        length_cm: { type: [number, 'null'], minimum: 0 }
        width_cm: { type: [number, 'null'], minimum: 0 }
        height_cm: { type: [number, 'null'], minimum: 0 }
        weight_kg: { type: [number, 'null'], minimum: 0 }
        fragile: { type: boolean, default: false }
        hazardous: { type: boolean, default: false }
        quantity: { type: integer, minimum: 0 }
        cost_net: { type: [number, 'null'], minimum: 0 }
        price_net: { type: [number, 'null'], minimum: 0 }
        price_gross: { type: [number, 'null'], minimum: 0 }
    Part:
      allOf:
        - $ref: '#/components/schemas/PartInput'
        - type: object
          required: [id, tenant_id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid }
            status: { type: string }
            location_id: { type: [string, 'null'], format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    LocationInput:
      type: object
      required: [warehouse_id, code, zone, location_type]
      properties:
        warehouse_id: { type: string, format: uuid }
        code: { type: string }
        zone: { type: string }
        location_type: { type: string }
        length_cm: { type: [number, 'null'], minimum: 0 }
        width_cm: { type: [number, 'null'], minimum: 0 }
        height_cm: { type: [number, 'null'], minimum: 0 }
        max_weight_kg: { type: [number, 'null'], minimum: 0 }
        allowed_categories:
          type: array
          items: { type: string }
        security_level: { type: integer, minimum: 1, maximum: 5, default: 1 }
    OrderInput:
      type: object
      required: [customer_id, items]
      properties:
        customer_id: { type: string, format: uuid }
        sales_channel: { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [part_id, quantity]
            properties:
              part_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
    Subscription:
      type: object
      required: [plan_code, status, monthly_price, currency]
      properties:
        plan_code: { type: string }
        status: { type: string }
        monthly_price: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        current_period_end: { type: [string, 'null'], format: date-time }
paths:
  /health:
    get:
      security: []
      summary: Service health
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, database, queue]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  database: { type: string }
                  queue: { type: string }
  /me:
    get:
      summary: Current authenticated user and tenant context
      operationId: getMe
      responses:
        '200':
          description: Current context
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /parts:
    get:
      summary: Search tenant parts
      operationId: listParts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Parts page
    post:
      summary: Create a part
      operationId: createPart
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartInput' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Part' } } }
        '409':
          description: Duplicate internal code or idempotency conflict
  /parts/{part_id}:
    parameters:
      - name: part_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get part
      operationId: getPart
      responses:
        '200': { description: Part, content: { application/json: { schema: { $ref: '#/components/schemas/Part' } } } }
        '404': { description: Not found }
    patch:
      summary: Update part with optimistic version check
      operationId: updatePart
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated }
        '409': { description: Version conflict }
  /locations:
    get:
      summary: List warehouse locations with occupancy
      operationId: listLocations
      responses:
        '200': { description: Locations }
    post:
      summary: Create warehouse location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201': { description: Created }
  /parts/{part_id}/putaway-recommendation:
    post:
      summary: Calculate directed putaway recommendation
      operationId: recommendPutaway
      parameters:
        - name: part_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ranked feasible locations with score and reasons
        '422':
          description: Missing dimensions, weight or no feasible location
  /stock-movements:
    post:
      summary: Record an immutable stock movement
      operationId: createStockMovement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [part_id, movement_type, quantity]
              properties:
                part_id: { type: string, format: uuid }
                movement_type: { type: string }
                from_location_id: { type: [string, 'null'], format: uuid }
                to_location_id: { type: [string, 'null'], format: uuid }
                quantity: { type: integer, minimum: 1 }
                reason: { type: [string, 'null'] }
      responses:
        '201': { description: Movement recorded }
        '409': { description: Idempotency or stock conflict }
  /orders:
    get:
      summary: List tenant orders
      operationId: listOrders
      responses:
        '200': { description: Orders }
    post:
      summary: Create order and reserve stock atomically
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201': { description: Order created }
        '409': { description: Insufficient or already reserved stock }
  /payments/webhooks/{provider}:
    post:
      security: []
      summary: Receive signed payment webhook
      operationId: receivePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Event accepted idempotently }
        '401': { description: Invalid signature }
  /subscription:
    get:
      summary: Get tenant subscription
      operationId: getSubscription
      responses:
        '200': { description: Subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
    patch:
      summary: Change plan or cancellation state
      operationId: updateSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code: { type: string }
                cancel_at_period_end: { type: boolean }
      responses:
        '200': { description: Updated }
  /audit-events:
    get:
      summary: Search audit events
      operationId: listAuditEvents
      parameters:
        - { name: object_type, in: query, schema: { type: string } }
        - { name: object_id, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Audit event page }
