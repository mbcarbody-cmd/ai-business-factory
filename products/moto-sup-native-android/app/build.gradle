plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mariuauto.motosuptracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mariuauto.motosuptracker'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-mvp'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
