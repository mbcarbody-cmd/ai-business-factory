<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Status — Quick Product Video</title>
<meta name="description" content="Track Quick Product Video order status by order ID.">
<style>
:root{--bg:#071019;--card:#101b28;--line:#2c3a4a;--text:#f7fbff;--muted:#afbdcc;--accent:#49f0a0;--warn:#ffd073}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1b2a3e 0,#071019 45%);color:var(--text);font-family:Arial,system-ui,sans-serif;line-height:1.5}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:linear-gradient(180deg,#132033,#0d1724);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px #0007}.cta{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:13px 17px;margin:8px 8px 0 0;background:var(--accent);color:#03110a;font-weight:900;text-decoration:none;cursor:pointer}.ghost{background:#192638;color:#fff;border:1px solid #3a5069}.muted{color:var(--muted)}input{width:100%;background:#071019;border:1px solid #384d66;color:#fff;border-radius:13px;padding:12px;font:inherit}.status{font-family:ui-monospace,Menlo,monospace;background:#08111d;border:1px solid #2b3b50;border-radius:14px;padding:12px;white-space:pre-wrap;color:#cfe0f4;font-size:12px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-weight:900;background:#20324a}.paid{background:#113b27;color:#bdf6d8}.pending{background:#3b3211;color:#ffe6ad}.delivered{background:#1b3150;color:#cde3ff}</style>
</head>
<body>
<main class="wrap">
<section class="card">
<h1>Quick Product Video order status</h1>
<p class="muted">Enter an order ID or open this page from checkout. Payment-pending orders are not counted as revenue until manually confirmed paid.</p>
<label for="oid">Order ID</label>
<input id="oid" placeholder="QPV-...">
<button class="cta" id="check">Check status</button>
<a class="cta ghost" href="./checkout.html">Create checkout order</a>
<a class="cta ghost" href="./offer.html">Back to offer</a>
<h2>Status</h2>
<div id="badge" class="pill pending">waiting</div>
<pre id="out" class="status">Enter order ID.</pre>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),demo={'QPV-DEMO-001':{status:'lead',paymentStatus:'payment_pending',priceEur:19},'QPV-DEMO-002':{status:'paid',paymentStatus:'paid',priceEur:19},'QPV-DEMO-003':{status:'delivered',paymentStatus:'paid',priceEur:19}};
function clean(v){return String(v||'').trim()}
function setBadge(status){const b=$('badge');b.textContent=status;b.className=`pill ${status==='paid'?'paid':status==='delivered'?'delivered':'pending'}`}
function lookup(){const id=clean($('oid').value);if(!id){setBadge('waiting');$('out').textContent='Enter order ID.';return}const url=new URLSearchParams(location.search),fromUrl=url.get('orderId')===id?{status:url.get('status')||'payment_pending',paymentStatus:url.get('status')||'payment_pending',priceEur:Number(url.get('price')||19),product:url.get('product')||''}:null;let stored=null;try{stored=JSON.parse(localStorage.getItem('qpvLastCheckoutOrder')||'null')}catch(error){stored=null}const record=(stored&&stored.orderId===id)?stored:fromUrl||demo[id];if(!record){setBadge('unknown');$('out').textContent=`Unknown order ${id}. Contact automariu@gmail.com with your order email.`;return}const normalized={orderId:id,product:record.product||record.item||'',priceEur:record.priceEur||19,paymentStatus:record.paymentStatus||record.status||'payment_pending',fulfillmentStatus:record.fulfillmentStatus||record.status||'lead',revenueCountedEur:(record.paymentStatus==='paid'||record.status==='paid'||record.status==='delivered')?19:0,nextAction:(record.paymentStatus==='paid'||record.status==='paid')?'Fulfillment / delivery':'Await payment confirmation'};setBadge(normalized.paymentStatus);$('out').textContent=JSON.stringify(normalized,null,2)}
$('check').addEventListener('click',lookup);
(function init(){const p=new URLSearchParams(location.search),id=p.get('orderId');if(id){$('oid').value=id;lookup()}}());
</script>
</body>
</html>
