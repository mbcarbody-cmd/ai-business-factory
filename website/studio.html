<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070913">
<title>Studio Video Builder</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070913;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#070913}</style>
</head>
<body>
<iframe id="studio" src="./video-maker.html?v=4" title="Studio Video Builder"></iframe>
<script>
const frame=document.getElementById('studio');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(doc.querySelector('script[data-stable-render]'))return;
    const script=doc.createElement('script');
    script.src='./video-render-fix.js?v=4';
    script.dataset.stableRender='true';
    doc.head.appendChild(script);
  }catch(error){console.error('Stable render patch failed to attach',error)}
});
</script>
</body>
</html>
