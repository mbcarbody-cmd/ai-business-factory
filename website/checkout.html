<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Quick Product Video</title></head>
<body>
<script>
'use strict';
const priceEur=19,ledgerKey='qpvOrderLedger';
function clean(v){return String(v||'').trim()}
function orderId(){const stamp=new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14);return `QPV-${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`}
function params(){return new URLSearchParams(location.search)}
function buildHandoff(data){const id=orderId(),createdAt=new Date().toISOString();return {proof:{orderId:id,leadId:data.leadId||'',product:'Quick Product Video',priceEur,paymentStatus:'payment_pending',buyer:data.contact,seller:data.brand,createdAt,updatedAt:createdAt}}}
</script>
</body>
</html>
