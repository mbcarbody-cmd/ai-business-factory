<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070913">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Quick Product Video</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070913;color:#f5f7ff;font-family:Arial,system-ui,sans-serif;overflow:hidden}.bar{height:54px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0c1323;border-bottom:1px solid #2a3650}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:38px;height:38px;border-radius:11px}.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.install{border:0;border-radius:11px;padding:9px 11px;font-weight:800;background:#4df0a1;color:#04130c;white-space:nowrap}iframe{display:block;width:100%;height:calc(100% - 54px);border:0;background:#070913}@media(display-mode:standalone){.bar{display:none}iframe{height:100%}}
  </style>
</head>
<body>
  <div class="bar"><div class="brand"><img src="./icon.svg" alt=""><b>Quick Product Video</b></div><button id="install" class="install">Įdiegti</button></div>
  <iframe src="./video-maker.html" title="Quick Product Video"></iframe>
  <script>
    let promptEvent=null;const button=document.getElementById('install');
    addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});
    button.onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null}else alert('Chrome meniu ⋮ pasirink „Įdiegti programėlę“ arba „Pridėti prie pagrindinio ekrano“.')};
    addEventListener('appinstalled',()=>{button.textContent='Įdiegta';button.disabled=true});
    if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
  </script>
</body>
</html>
