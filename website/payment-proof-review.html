<!doctype html><html><head><meta charset='utf-8'><title>Payment Proof Review</title></head><body><h1>Payment Proof Review</h1><p>Paste payment proof JSON from payment.html. Revenue remains 0 EUR until matching order is marked paid in order-admin.</p><textarea id='proof' style='width:100%;height:220px'></textarea><button onclick='run()'>Validate proof</button><pre id='out'></pre><a href='./order-admin.html'>Open order admin</a><script>function run(){try{const p=JSON.parse(document.getElementById('proof').value);if(!p.orderId)throw new Error('Missing orderId');document.getElementById('out').textContent=JSON.stringify({valid:true,orderId:p.orderId,buyer:p.buyer||'',revenueCountedEur:0,nextStep:'Mark paid manually in order-admin after verification'},null,2)}catch(e){document.getElementById('out').textContent='INVALID: '+e.message}}</script></body></html>
